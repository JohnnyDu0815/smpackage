name: Update contributors

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    name: Update README contributors list
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update README.md
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        with:
          image_size: 80
          columns_per_row: 7
          readme_path: README.md
          auto_detect_branch_protection: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README_zh.md
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        with:
          image_size: 80
          columns_per_row: 7
          readme_path: README_zh.md
          auto_detect_branch_protection: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
